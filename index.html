async function startPlanCheckout(planName){

async function verifyCashfreeReturn(){
 const params=new URLSearchParams(location.search);
 if(params.get('payment')!=='return'||!params.get('order_id')||!db)return;
 const orderId=params.get('order_id');
 try{
  const {data:{session}={}}=await db.auth.getSession();
  if(!session){alert('Payment return received. Sign in with the purchasing account to verify the payment status.');return;}
  const {data,error}=await db.functions.invoke('cashfree-payments',{body:{action:'verify-plan-order',order_id:orderId}});
  if(error||!data?.success)throw new Error(data?.error||error?.message||'Payment verification is unavailable.');
  if(data.status==='success')alert('Payment confirmed by Cashfree. Your '+(data.plan||'')+' package is active.');
  else if(data.status==='pending')alert('Cashfree payment is still pending. Your package will activate only after confirmation.');
  else alert('Payment was not confirmed. Your package has not been activated.');
 }catch(e){alert((e?.message||'Could not verify payment.')+' Your package will not activate unless Cashfree confirms payment.');}
 finally{history.replaceState({},document.title,location.pathname+location.hash);}
}
if(new URLSearchParams(location.search).get('payment')==='return')verifyCashfreeReturn();

async function merchantLogin(){
 if(!db){app.innerHTML='<div class="panel center"><h1>Login unavailable</h1><p>Database connection is unavailable. Please try again.</p><a class="btn outline" href="/">Main website</a></div>';return;}
 const {data:{session}={}}=await db.auth.getSession();
 if(session?.user){const {data:grant}=await db.from('platform_admins').select('user_id,is_active').eq('user_id',session.user.id).eq('is_active',true).maybeSingle();if(grant){location.href='/admin';return;}await dashboard();return;}
 app.innerHTML='<section class="panel center" style="max-width:520px"><span class="eyebrow">APPROVED MERCHANT ACCESS</span><h1>Store Admin Login</h1><p class="muted">Use the account invited by GenieDevs. Store creation and URL assignment are managed by the platform administrator.</p><form id="merchantLoginForm"><div class="field"><label for="merchantEmail">Email</label><input id="merchantEmail" type="email" autocomplete="username" required></div><div class="field"><label for="merchantPassword">Password</label><input id="merchantPassword" type="password" autocomplete="current-password" required></div><button class="btn primary" type="submit">Sign in</button></form><button class="btn outline" id="merchantReset" style="margin-top:10px">Send password reset email</button><div id="merchantLoginNotice" class="notice hidden" role="status"></div><p class="muted small">No account yet? <a href="/#support" style="text-decoration:underline">Request store access</a>.</p><a class="btn outline" href="/">Main website</a></section>';
 document.getElementById('merchantLoginForm').onsubmit=async e=>{e.preventDefault();const b=e.submitter;b.disabled=true;b.textContent='Signing in…';const {error}=await db.auth.signInWithPassword({email:document.getElementById('merchantEmail').value.trim(),password:document.getElementById('merchantPassword').value});if(error){notify('merchantLoginNotice',error.message,'err');document.getElementById('merchantLoginNotice').classList.remove('hidden');b.disabled=false;b.textContent='Sign in';return;}const {data:{user:loggedIn}={}}=await db.auth.getUser();const {data:grant}=await db.from('platform_admins').select('user_id,is_active').eq('user_id',loggedIn.id).eq('is_active',true).maybeSingle();if(grant){location.href='/admin';return;}await dashboard();};
 document.getElementById('merchantReset').onclick=async()=>{const email=document.getElementById('merchantEmail').value.trim();if(!email){notify('merchantLoginNotice','Enter your account email first.','err');document.getElementById('merchantLoginNotice').classList.remove('hidden');return;}const {error}=await db.auth.resetPasswordForEmail(email,{redirectTo:location.origin+'/login'});notify('merchantLoginNotice',error?error.message:'If email delivery is configured, a reset email will be sent.',''+(error?'err':'ok'));document.getElementById('merchantLoginNotice').classList.remove('hidden');};
}
async function dashboard(){const {data:auth}=await db.auth.getUser();user=auth.user;if(!user){landing();return;}document.getElementById('navAuth').textContent='Dashboard';const {data:ts,error}=await db.from('tenants').select('id,user_id,tenant_code,package_type,product_limit,whatsapp_number,business_name,slug,is_published').eq('user_id',user.id).limit(1);if(error){app.innerHTML='<div class="panel center"><h2>Could not load your store</h2><p>'+escapeHtml(error.message)+'</p><button id="logout" class="btn outline">Sign out</button></div>';document.getElementById('logout').onclick=logout;return;}if(!ts?.length){app.innerHTML='<div class="panel center"><h1>Store not assigned yet</h1><p class="muted">The platform administrator has not assigned a store URL to this account yet. Please contact support. You cannot create a store from this account.</p><a class="btn primary" href="/#support">Contact support</a> <button id="logout" class="btn outline">Sign out</button></div>';document.getElementById('logout').onclick=logout;return;}tenant=ts[0];await renderDashboard();}
async function renderDashboard(){const t=tenant;const {data:products,error}=await db.from('products').select('id,tenant_id,name,price,image_url,description,is_available,created_at').eq('tenant_id',t.id).order('created_at',{ascending:false});if(error){app.innerHTML='<div class="panel center"><h2>Product list could not load</h2><p>'+escapeHtml(error.message)+'</p></div>';return;}const limit=Number(t.product_limit||50);const activeProducts=products.filter(p=>p.is_available).length;const {data:orders}=await db.from('orders').select('id,reference_code,customer_name,customer_phone,customer_address,items,total_amount,status,created_at').eq('tenant_id',t.id).order('created_at',{ascending:false}).limit(50);
app.innerHTML=`<section class="sections"><div class="toolbar"><div><span class="eyebrow">Merchant dashboard</span><h1 style="margin:8px 0">${escapeHtml(t.business_name)}</h1><p class="muted">Manage your storefront and product catalog.</p></div><div class="row"><button id="copyLink" class="btn outline">Copy store link</button><button id="logout" class="btn outline">Sign out</button></div></div><div class="featuregrid" style="margin:22px 0"><div class="feature"><p class="muted">Active products</p><h2>${activeProducts} / ${limit}</h2><p class="muted small">${products.length-activeProducts} unavailable · retained in your catalog</p></div><div class="feature"><p class="muted">Store</p><h2>${t.is_published?'Published':'Draft'}</h2></div><div class="feature"><p class="muted">Plan</p><h2>${escapeHtml(t.package_type||'Not assigned')}</h2><p class="muted small">Product limit: ${limit}. Paid features apply only after verified payment.</p></div></div>
<div class="panel"><div class="toolbar"><div><h2 style="margin:0">Store settings</h2><p class="muted small">Public URL: <a href="/${encodeURIComponent(t.slug)}" target="_blank" rel="noopener">/${escapeHtml(t.slug)}</a></p></div><button id="publish" class="btn ${t.is_published?'outline':'primary'}">${t.is_published?'Unpublish':'Publish store'}</button></div><form id="settings" class="productgrid"><div class="field"><label>Business name</label><input id="storeName" maxlength="80" value="${escapeHtml(t.business_name||'')}" required></div><div class="field"><label>WhatsApp number (country code, digits only)</label><input id="phone" value="${escapeHtml(t.whatsapp_number||'')}" placeholder="919876543210"></div><div class="field"><label>Store URL slug</label><input id="slug" value="${escapeHtml(t.slug||'')}" pattern="[a-z0-9]+(-[a-z0-9]+)*" required></div><div><button class="btn primary">Save settings</button></div><div id="settingsNotice" class="notice hidden"></div></form></div>
<div class="panel" style="margin-top:18px"><h2>Add a product</h2><p class="muted small">Up to ${limit} active/listed products. Currently ${activeProducts} active. Mark an item unavailable to free a slot; its details stay saved.</p><form id="productForm" class="productgrid"><div class="field"><label>Product name</label><input id="pName" maxlength="120" required></div><div class="field"><label>Price (₹)</label><input id="pPrice" type="number" min="0" step="1" required></div><div class="field"><label>Description</label><input id="pDesc" maxlength="500" placeholder="Short product details"></div><div class="field"><label>Image URL (optional)</label><input id="pImage" type="url" placeholder="https://…"></div><div><button class="btn primary" ${activeProducts>=limit?'disabled':''}>Add product</button></div><div id="productNotice" class="notice hidden"></div></form></div>
<h2 style="margin-top:26px">Your products</h2><div class="productgrid">${products.length?products.map(p=>'<article class="product">'+(p.image_url?'<img src="'+escapeHtml(p.image_url)+'" alt="'+escapeHtml(p.name)+'">':'<div class="empty">No image</div>')+'<h3>'+escapeHtml(p.name)+'</h3><p class="muted small">'+escapeHtml(p.description||'')+'</p><div class="price">₹'+Number(p.price).toLocaleString('en-IN')+'</div><p>'+ (p.is_available?'<span class="pill">Available</span>':'<span class="pill" style="background:#fff4db;color:#7a4d00">Unavailable</span>')+'</p><div class="row"><button class="btn outline" data-edit="'+escapeHtml(p.id)+'">Edit</button><button class="btn outline" data-toggle="'+escapeHtml(p.id)+'" data-available="'+String(p.is_available)+'">'+(p.is_available?'Mark unavailable':'Mark available')+'</button><button class="btn danger" data-delete="'+escapeHtml(p.id)+'">Delete</button></div></article>').join(''):'<div class="empty">No products yet. Add your first product above.</div>'}</div>
<h2 style="margin-top:28px">Orders</h2><p class="muted small">Orders saved through the secure checkout endpoint are shown below.</p><div class="stack">${orders?.length?orders.map(o=>'<article class="product"><div class="toolbar"><div><b>'+escapeHtml(o.reference_code||'Order')+'</b><p class="muted small">'+escapeHtml(o.customer_name)+' · '+escapeHtml(o.customer_phone)+' · '+new Date(o.created_at).toLocaleString()+'</p></div><b>₹'+Number(o.total_amount||0).toLocaleString('en-IN')+'</b></div><p class="small">'+escapeHtml(o.customer_address||'')+'</p><label class="small">Status <select data-status="'+escapeHtml(o.id)+'">'+['pending','confirmed','preparing','completed','cancelled'].map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label></article>').join(''):'<div class="empty">No saved orders yet.</div>'}</div><p class="muted small" style="margin-top:24px">Payment activation and paid-plan status must be verified separately from this dashboard.</p></section>`;
document.getElementById('logout').onclick=logout;document.getElementById('copyLink').onclick=async()=>{const url=location.origin+'/'+t.slug;try{await navigator.clipboard.writeText(url);document.getElementById('copyLink').textContent='Copied';}catch{prompt('Copy store link',url);}};
document.getElementById('publish').onclick=async()=>{const {data,error}=await db.from('tenants').update({is_published:!t.is_published,updated_at:new Date().toISOString()}).eq('id',t.id).select('id').maybeSingle();if(error||!data){alert(error?.message||'Could not update publication status.');return;}t.is_published=!t.is_published;await renderDashboard();};
document.getElementById('settings').onsubmit=async e=>{e.preventDefault();const payload={business_name:document.getElementById('storeName').value.trim(),whatsapp_number:document.getElementById('phone').value.replace(/\D/g,''),slug:slugify(document.getElementById('slug').value),updated_at:new Date().toISOString()};const {data,error}=await db.from('tenants').update(payload).eq('id',t.id).select('id').maybeSingle();if(error||!data)return notify('settingsNotice',error?.message||'No changes saved.','err');Object.assign(t,payload);notify('settingsNotice','Settings saved.','ok');};
document.getElementById('productForm').onsubmit=async e=>{e.preventDefault();if(products.filter(p=>p.is_available).length>=limit)return notify('productNotice','Your package allows up to '+limit+' active products. Mark an existing product unavailable or upgrade your package.','err');const payload={tenant_id:t.id,name:document.getElementById('pName').value.trim(),price:Math.round(Number(document.getElementById('pPrice').value)),description:document.getElementById('pDesc').value.trim(),image_url:document.getElementById('pImage').value.trim()||null,is_available:true};const {error}=await db.from('products').insert(payload);if(error)return notify('productNotice',error.message,'err');await renderDashboard();};
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this product?'))return;const {error}=await db.from('products').delete().eq('id',b.dataset.delete).eq('tenant_id',t.id);if(error)alert(error.message);else await renderDashboard();});
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.edit);const name=prompt('Product name',p.name);if(name===null)return;const price=prompt('Price in rupees',p.price);if(price===null)return;const description=prompt('Description',p.description||'');if(description===null)return;const image=prompt('Public image URL (optional)',p.image_url||'');if(image===null)return;db.from('products').update({name:name.trim(),price:Math.round(Number(price)),description:description.trim(),image_url:image.trim()||null}).eq('id',p.id).eq('tenant_id',t.id).then(({error})=>error?alert(error.message):renderDashboard());});
document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const willActivate=b.dataset.available!=='true';if(willActivate&&products.filter(p=>p.is_available).length>=limit){alert('Your package allows up to '+limit+' active products. Mark another product unavailable or upgrade your package.');return;}const {error}=await db.from('products').update({is_available:willActivate}).eq('id',b.dataset.toggle).eq('tenant_id',t.id);if(error)alert(error.message);else await renderDashboard();});

async function publicStore(slug){const {data:t,error}=await db.from('tenants').select('id,business_name,slug,whatsapp_number,is_published').eq('slug',slug).eq('is_published',true).maybeSingle();if(error||!t){app.innerHTML='<div class="panel center"><h1>Store not found</h1><p class="muted">This store may be unpublished or the URL is incorrect.</p><a class="btn primary" href="/">Visit GenieDevs</a></div>';return;}const {data:products}=await db.from('products').select('id,name,price,image_url,description,is_available').eq('tenant_id',t.id).eq('is_available',true).order('created_at',{ascending:false});let cart=[];app.innerHTML='<section class="storehead"><span class="eyebrow">GenieDevs storefront</span><h1>'+escapeHtml(t.business_name)+'</h1><p class="muted">Choose products and send your order request through WhatsApp.</p></section><section class="sections"><div class="productgrid">'+((products||[]).length?products.map(p=>'<article class="product">'+(p.image_url?'<img src="'+escapeHtml(p.image_url)+'" alt="'+escapeHtml(p.name)+'">':'<div class="empty">Product</div>')+'<h3>'+escapeHtml(p.name)+'</h3><p class="muted small">'+escapeHtml(p.description||'')+'</p><div class="price">₹'+Number(p.price).toLocaleString('en-IN')+'</div><button class="btn primary" data-cart="'+escapeHtml(p.id)+'">Add to cart</button></article>').join(''):'<div class="empty">No available products yet.</div>')+'</div><div class="panel" style="margin-top:22px"><h2>Your cart</h2><div id="cartItems" class="stack">Cart is empty.</div><div class="field"><label>Your name</label><input id="customerName" maxlength="100" required></div><div class="field"><label>Phone number</label><input id="customerPhone" type="tel" maxlength="30" required></div><div class="field"><label>Delivery address / notes</label><textarea id="customerAddress" maxlength="500" rows="3" required></textarea></div><button class="btn primary" id="whatsAppOrder">Send order request on WhatsApp</button><div class="notice" id="checkoutNotice">Your order will be saved securely before WhatsApp opens. Keep the order reference for tracking.</div></div></section>';
const renderCart=()=>{const box=document.getElementById('cartItems');if(!cart.length){box.textContent='Cart is empty.';return;}box.innerHTML=cart.map(x=>'<div class="toolbar"><span>'+escapeHtml(x.name)+' × '+x.qty+'</span><b>₹'+(x.price*x.qty).toLocaleString('en-IN')+'</b><button class="btn outline" data-remove="'+escapeHtml(x.id)+'">Remove</button></div>').join('')+'<h3>Total: ₹'+cart.reduce((a,x)=>a+x.price*x.qty,0).toLocaleString('en-IN')+'</h3>';box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.id!==b.dataset.remove);renderCart();});};
app.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{const p=(products||[]).find(x=>x.id===b.dataset.cart);const old=cart.find(x=>x.id===p.id);if(old)old.qty++;else cart.push({id:p.id,name:p.name,price:Number(p.price),qty:1});renderCart();});
document.getElementById('whatsAppOrder').onclick=async()=>{const button=document.getElementById('whatsAppOrder');const name=document.getElementById('customerName').value.trim(),phone=document.getElementById('customerPhone').value.trim(),address=document.getElementById('customerAddress').value.trim();if(!cart.length)return notify('checkoutNotice','Add at least one product first.','err');if(name.length<2||!phone||address.length<5)return notify('checkoutNotice','Please enter a valid name, phone and delivery address.','err');if(button.disabled)return;const waWindow=window.open('about:blank','_blank');button.disabled=true;button.textContent='Saving order…';try{const {data,error}=await db.rpc('create_store_order',{p_slug:slug,p_customer_name:name,p_customer_phone:phone,p_customer_address:address,p_items:cart.map(x=>({product_id:x.id,quantity:x.qty}))});if(error)throw error;const order=Array.isArray(data)?data[0]:data;if(!order||!order.reference_code)throw new Error('Order response was incomplete. Please check your order status before retrying.');const ownerPhone=String(order.store_whatsapp||t.whatsapp_number||'').replace(/\D/g,'');const total=Number(order.total_amount||0);const message='New order for '+(order.store_name||t.business_name)+'\nOrder reference: '+order.reference_code+'\n\nCustomer: '+name+'\nPhone: '+phone+'\nAddress: '+address+'\n\nItems:\n'+cart.map(x=>x.name+' x '+x.qty+' = ₹'+(x.price*x.qty)).join('\n')+'\n\nTotal: ₹'+total;if(ownerPhone){if(waWindow)waWindow.location.href='https://wa.me/'+ownerPhone+'?text='+encodeURIComponent(message);else window.location.href='https://wa.me/'+ownerPhone+'?text='+encodeURIComponent(message);notify('checkoutNotice','Order saved successfully. Reference: '+order.reference_code+'. WhatsApp chat is opening.','ok');}else{if(waWindow)waWindow.close();notify('checkoutNotice','Order saved successfully. Reference: '+order.reference_code+'. The store owner has not configured WhatsApp yet.','ok');}cart=[];renderCart();}catch(err){if(waWindow)waWindow.close();notify('checkoutNotice',err.message||'Could not save the order. Please try again.','err');}finally{button.disabled=false;button.textContent='Send order request on WhatsApp';}};
}

   if(canManage&&tenants.length){document.getElementById('adminAddProduct').onsubmit=async e=>{e.preventDefault();const tenantId=document.getElementById('adminProductStore').value,name=document.getElementById('adminProductName').value.trim(),price=Number(document.getElementById('adminProductPrice').value),description=document.getElementById('adminProductDescription').value.trim(),imageUrl=document.getElementById('adminProductImage').value.trim();if(name.length<1||!Number.isFinite(price)||price<0)return note('Enter a valid product name and non-negative price.','err');const submit=e.submitter;submit.disabled=true;const {data,error}=await db.from('products').insert({tenant_id:tenantId,name,price:Math.round(price),description,image_url:imageUrl||null,is_available:true}).select('id').single();if(error){note('Product creation failed: '+error.message,'err');submit.disabled=false;return;}await audit('admin_created_product','product',data.id,{tenant_id:tenantId,name,price});note('Product created. It will appear on the storefront only when the store is published.','ok');await loadView('products');};}
   if(canManage)box.querySelectorAll('[data-edit-product]').forEach(b=>b.onclick=async()=>{const p=products.find(x=>x.id===b.dataset.editProduct);const name=prompt('Product name:',p.name);if(name===null)return;const priceText=prompt('Price (INR):',String(p.price));if(priceText===null)return;const price=Number(priceText);if(!name.trim()||!Number.isFinite(price)||price<0)return note('Enter a product name and a valid non-negative price.','err');const description=prompt('Description:',p.description||'');if(description===null)return;const available=confirm('OK = product available on storefront. Cancel = hide product.');b.disabled=true;const {error}=await db.from('products').update({name:name.trim(),price,description,is_available:available}).eq('id',p.id);if(error){note('Product update failed: '+error.message,'err');b.disabled=false;return;}await audit('product_updated','product',p.id,{name:name.trim(),price,is_available:available});note('Product updated.','ok');loadView('products');});

   box.innerHTML='<h2>User management & account safety</h2><p class="muted">Auth account actions run server-side and require active platform-admin verification. Passwords are never visible to admins. Suspended users are blocked from signing in; their stores are unpublished and suspended.</p><form id="addRequestedUserForm" class="productgrid" style="margin:16px 0;padding:16px;border:1px solid var(--line);border-radius:14px"><div class="field"><label for="requestedUserEmail">Requested user email</label><input id="requestedUserEmail" type="email" placeholder="user@example.com" required></div><div class="field"><label for="requestedStoreName">Business / store name</label><input id="requestedStoreName" maxlength="80" placeholder="Business name" required></div><div><button class="btn primary" type="submit">Approve user & create store</button></div><p class="muted small">Sends an invite email, creates a draft store URL, and lets the user set their own password. Email delivery must be configured in Supabase.</p><div id="addRequestedUserNotice" class="notice hidden"></div></form><div class="field"><label for="userSearch">Search email or User ID</label><input id="userSearch" type="search" placeholder="Search registered users…"></div><div id="managedUsers"><p class="muted">Loading registered Auth accounts…</p></div><div id="userInspect"></div>';
   const userHost=document.getElementById('managedUsers');
   document.getElementById('addRequestedUserForm').onsubmit=async e=>{e.preventDefault();const form=e.currentTarget,btn=form.querySelector('button[type="submit"]'),email=document.getElementById('requestedUserEmail').value.trim().toLowerCase(),businessName=document.getElementById('requestedStoreName').value.trim(),status=document.getElementById('addRequestedUserNotice');if(!email||businessName.length<2){status.textContent='Enter a valid email and business name.';status.className='notice err';return;}if(!confirm('Approve '+email+' and create a draft store for '+businessName+'?'))return;btn.disabled=true;btn.textContent='Creating user and store…';status.className='notice hidden';const {data,error}=await db.functions.invoke('platform-user-management',{body:{action:'invite-user',email}});if(error||data?.error){status.textContent='User creation/invitation failed: '+(data?.error||error?.message||'Unknown error');status.className='notice err';btn.disabled=false;btn.textContent='Approve user & create store';return;}const uid=data.user_id;const {data:existingStores,error:storeLookupError}=await db.from('tenants').select('id,slug,business_name').eq('user_id',uid).limit(1);if(storeLookupError){status.textContent='User account is ready, but store lookup failed: '+storeLookupError.message;status.className='notice err';btn.disabled=false;btn.textContent='Approve user & create store';await loadView('users');return;}let store=existingStores?.[0];if(!store){const slug=slugify(businessName)+'-'+Math.random().toString(36).slice(2,6);const {data:createdStore,error:storeError}=await db.from('tenants').insert({user_id:uid,tenant_code:'GD-'+crypto.randomUUID().replace(/-/g,'').slice(0,12).toUpperCase(),package_type:'Demo',product_limit:10,business_name:businessName,slug,is_published:false,is_suspended:false,whatsapp_number:null}).select('id,slug,business_name').single();if(storeError){status.textContent='User account/invite is ready, but store creation failed: '+storeError.message;status.className='notice err';btn.disabled=false;btn.textContent='Approve user & create store';await loadView('users');return;}store=createdStore;await audit('admin_created_store','tenant',store.id,{user_id:uid,business_name:businessName,slug,approved_user:true});}status.textContent='User approved. Store URL: '+location.origin+'/'+store.slug+'. '+(data.already_existed?'Existing account reused.':'Invite email requested; delivery depends on Supabase email settings.');status.className='notice ok';form.reset();btn.disabled=false;btn.textContent='Approve user & create store';await loadView('users');};
   const renderManaged=(managedUsers)=>{

     if(userProductsR.error||userOrdersR.error){note('Could not load this user’s products/orders: '+(userProductsR.error?.message||userOrdersR.error?.message||'Unknown error'),'err');return;}

     const orderRows=userOrders.slice(0,100).map(o=>'<tr><td>'+escapeHtml(o.reference_code||o.id)+'</td><td>'+escapeHtml(o.customer_name||'—')+'<br><small>'+escapeHtml(o.customer_phone||'')+'</small></td><td>₹'+Number(o.total_amount||0).toLocaleString('en-IN')+'</td><td>'+escapeHtml(o.status||'—')+'</td></tr>').join('')||'<tr><td colspan="4">No order records in the current result window.</td></tr>';
     document.getElementById('userInspect').innerHTML='<h3>User profile · '+escapeHtml(u.email||u.user_id)+'</h3><div class="admin-detail"><div>Email<b>'+escapeHtml(u.email||'—')+'</b></div><div>User ID<b style="overflow-wrap:anywhere">'+escapeHtml(u.user_id)+'</b></div><div>Account status<b>'+(u.is_banned?'Suspended':'Active')+'</b></div><div>Email confirmed<b>'+escapeHtml(u.email_confirmed_at?new Date(u.email_confirmed_at).toLocaleString():'Not confirmed')+'</b></div><div>Registered<b>'+escapeHtml(u.created_at?new Date(u.created_at).toLocaleString():'—')+'</b></div><div>Last sign in<b>'+escapeHtml(u.last_sign_in_at?new Date(u.last_sign_in_at).toLocaleString():'Never')+'</b></div><div>Products / Orders<b>'+Number(u.product_count||0)+' / '+Number(u.order_count||0)+'</b></div></div><h3>Linked stores</h3><div class="admin-detail">'+stores+'</div>'+(canManage&&!(u.stores||[]).length?'<button class="btn primary" data-user-create-store="'+escapeHtml(u.user_id)+'">Create store for this user</button>':'')+'<h3>Products added by this user</h3>'+table(['Product','Price','Visibility','Actions'],productRows)+'<h3>Orders received by this user</h3>'+table(['Order reference','Customer','Total','Status'],orderRows)+'<p class="muted">Password is intentionally not visible. Use “Send password reset” to let the user set a new password securely. Order rows appear after a customer submits an order through a published store.</p>';
     document.getElementById('userInspect').querySelectorAll('[data-user-create-store]').forEach(btn=>btn.onclick=async()=>{if(!canManage)return;const businessName=prompt('Business / store name for '+(u.email||u.user_id)+':');if(businessName===null)return;if(businessName.trim().length<2)return note('Enter a store name with at least 2 characters.','err');const slug=slugify(businessName)+'-'+Math.random().toString(36).slice(2,6);btn.disabled=true;const {data,error}=await db.from('tenants').insert({user_id:u.user_id,tenant_code:'GD-'+crypto.randomUUID().replace(/-/g,'').slice(0,12).toUpperCase(),package_type:'Demo',product_limit:10,business_name:businessName.trim(),slug,is_published:false,is_suspended:false,whatsapp_number:null}).select('id').single();if(error){note('Store creation failed: '+error.message,'err');btn.disabled=false;return;}await audit('admin_created_store','tenant',data.id,{user_id:u.user_id,business_name:businessName.trim(),slug});note('Draft store created. Add products from the Products tab, then publish only when ready.','ok');await loadView('users');});

     document.getElementById('userInspect').querySelectorAll('[data-user-edit-product]').forEach(btn=>btn.onclick=()=>{const p=userProducts.find(x=>x.id===btn.dataset.userEditProduct);if(!p)return;const name=prompt('Product name:',p.name);if(name===null)return;const priceText=prompt('Price (INR):',String(p.price));if(priceText===null)return;const price=Number(priceText);if(!name.trim()||!Number.isFinite(price)||price<0)return note('Enter a product name and valid price.','err');const description=prompt('Description:',p.description||'');if(description===null)return;const available=confirm('OK = product available. Cancel = hide product.');btn.disabled=true;db.functions.invoke('platform-user-management',{body:{action:'product-update',user_id:u.user_id,product_id:p.id,name:name.trim(),price,description,is_available:available}}).then(async({data,error})=>{if(error||data?.error){note('Product update failed: '+(data?.error||error?.message||'Unknown error'),'err');btn.disabled=false;return;}note('Product updated.','ok');loadView('users');});});
    });
    userHost.querySelectorAll('[data-user-edit]').forEach(b=>b.onclick=async()=>{
     const u=managedUsers.find(x=>x.user_id===b.dataset.userEdit);if(!u)return;
     const email=prompt('Account email:',u.email||'');if(email===null)return;
     const firstStore=(u.stores||[])[0]||null;
     let business_name='',slug='',whatsapp='',package_type='',product_limit=10;
     if(firstStore){
      business_name=prompt('Store / business name:',firstStore.business_name||'');if(business_name===null)return;
      slug=prompt('Store URL slug (without /store/):',firstStore.slug||'');if(slug===null)return;
      whatsapp=prompt('WhatsApp number (blank to clear):',firstStore.whatsapp_number||'');if(whatsapp===null)return;
      package_type=prompt('Package name:',firstStore.package_type||'Demo');if(package_type===null)return;
      const product_limit_text=prompt('Product limit (whole number):',String(firstStore.product_limit??10));if(product_limit_text===null)return;
      product_limit=Number(product_limit_text);if(!Number.isInteger(product_limit)||product_limit<0||product_limit>10000)return note('Product limit must be a whole number from 0 to 10000.','err');
     }
     if(!confirm('Save account email'+(firstStore?' and store settings':'')+'? This will not delete products or orders.'))return;
     b.disabled=true;
     try{
      const {data,error}=await db.functions.invoke('platform-user-management',{body:{action:'update-user',user_id:u.user_id,email:email.trim(),...(firstStore?{store_id:firstStore.id,business_name:business_name.trim(),slug:slug.trim().toLowerCase(),whatsapp_number:whatsapp,package_type,product_limit}: {})}});
      if(error||data?.error){note('User/store update failed: '+(data?.error||error?.message||'Unknown error'),'err');b.disabled=false;return;}
      note('User/store details saved.','ok');
      await loadView('users');
     }catch(e){note('User/store update failed: '+(e?.message||'Unexpected error'),'err');b.disabled=false;}
    });
    userHost.querySelectorAll('[data-user-ban]').forEach(b=>b.onclick=async()=>{
     const id=b.dataset.userBan,was=b.dataset.suspended==='true';

     if(!was&&(reason===null||reason.trim().length<5))return note('A clear suspension reason (at least 5 characters) is required.','err');
     if(!confirm((was?'Restore sign-in access for this user?':'Suspend this user and unpublish/suspend their stores?')+' This action will be recorded in the audit log.'))return;

     const {data,error}=await db.functions.invoke('platform-user-management',{body:{action:'send-reset',user_id:b.dataset.userReset}});

     note(data?.message||'Password reset email requested. Confirm SMTP/email delivery is configured.','ok');b.disabled=false;

async function logout(){await db.auth.signOut();user=null;tenant=null;landing();window.scrollTo(0,0);}
async function init(){const path=decodeURIComponent(location.pathname).replace(/\/+$/,'')||'/';if(path==='/admin'){await adminPanel();return;}if(path==='/login'){await merchantLogin();return;}if(path==='/demo'){demo();return;}if(path.startsWith('/store/')){if(!db){app.innerHTML='<div class="panel center"><h1>Could not connect</h1><p>Please refresh and try again.</p></div>';return;}await publicStore(path.split('/')[2]||'');return;}if(path!=='/'&&path!=='/index.html'){if(!db){app.innerHTML='<div class="panel center"><h1>Could not connect</h1><p>Please refresh and try again.</p></div>';return;}await publicStore(path.slice(1));return;}landing();document.getElementById('navAuth').onclick=()=>{location.href='/login';};}

function setupTheme(){
const saved=(()=>{try{return localStorage.getItem('geniedevs-theme')}catch{return null}})();
const initial=saved==='light'?'light':'dark';
document.body.dataset.theme=initial;
const toggle=document.getElementById('themeToggle');
if(!toggle)return;
const paint=()=>{const light=document.body.dataset.theme==='light';toggle.textContent=light?'🌙 Dark':'☀️ Light';toggle.setAttribute('aria-label',light?'Switch to dark theme':'Switch to light theme');toggle.title=light?'Switch to dark theme':'Switch to light theme';};
paint();
toggle.onclick=()=>{const next=document.body.dataset.theme==='light'?'dark':'light';document.body.dataset.theme=next;try{localStorage.setItem('geniedevs-theme',next)}catch{}paint();};
}
setupTheme();
init();
})();
