function showAuth(nextMode='signin'){
  mode=nextMode==='signup'?'signup':'signin';
  app.innerHTML='<section class="sections"><div class="panel center"><span class="eyebrow">GENIEDEVS ACCOUNT</span><h1>'+ (mode==='signup'?'Create your account':'Sign in') +'</h1><p class="muted">'+(mode==='signup'?'Create a free account to start the real-store testing flow.':'Sign in to manage your store or open the admin console.')+'</p>' +
    (mode==='signup'?'<div class="field"><label>Business name</label><input id="authBusiness" maxlength="80" autocomplete="organization" required></div>':'')+
    '<div class="field"><label>Email address</label><input id="authEmail" type="email" maxlength="200" autocomplete="email" required></div><div class="field"><label>Password (at least 8 characters)</label><input id="authPassword" type="password" minlength="8" maxlength="128" autocomplete="'+(mode==='signup'?'new-password':'current-password')+'" required></div><div id="authNotice" class="notice hidden" role="status"></div><div class="row"><button id="authSubmit" class="btn primary">'+(mode==='signup'?'Create free account':'Sign in')+'</button><button id="authSwitch" class="btn outline">'+(mode==='signup'?'I already have an account':'Create an account')+'</button><button id="authHome" class="btn outline">Back to home</button></div><p class="muted small">Paid packages and live online payments are not active yet. No payment will be taken in this flow.</p></div></section>';
  document.getElementById('navAuth').textContent='Home';
  document.getElementById('navAuth').onclick=()=>{landing();};
  document.getElementById('authHome').onclick=()=>{landing();window.scrollTo(0,0);};
  document.getElementById('authSwitch').onclick=()=>showAuth(mode==='signup'?'signin':'signup');
  document.getElementById('authSubmit').onclick=async()=>{
    const email=document.getElementById('authEmail').value.trim().toLowerCase();
    const password=document.getElementById('authPassword').value;
    const business=(document.getElementById('authBusiness')?.value||'').trim();
    const notice=document.getElementById('authNotice');
    const say=(message,type='')=>{notice.textContent=message;notice.className='notice '+type;};
    if(!email||!password||password.length<8){say('Enter a valid email and a password with at least 8 characters.','err');return;}
    if(mode==='signup'&&business.length<2){say('Enter your business name.','err');return;}
    const btn=document.getElementById('authSubmit');btn.disabled=true;btn.textContent='Please wait…';
    try{
      if(mode==='signup'){
        const {data,error}=await db.auth.signUp({email,password,options:{data:{business_name:business}}});
        if(error)throw error;
        if(!data.session){say('Account request received. Check your email for the confirmation link, then return here and sign in. Store setup starts after email verification.','ok');return;}
        user=data.user;const created=await createTenant(business);if(!created)throw new Error('Account created, but store setup could not finish. Sign in and retry store setup.');tenant=created;await dashboard();return;
      }
      const {data,error}=await db.auth.signInWithPassword({email,password});if(error)throw error;
      user=data.user;await dashboard();
    }catch(e){say(e?.message||'Could not complete the request. Please try again.','err');}
    finally{if(document.getElementById('authSubmit')){document.getElementById('authSubmit').disabled=false;document.getElementById('authSubmit').textContent=mode==='signup'?'Create free account':'Sign in';}}
  };
}

app.innerHTML=`<section class="sections"><div class="toolbar"><div><span class="eyebrow">Merchant dashboard</span><h1 style="margin:8px 0">${escapeHtml(t.business_name)}</h1><p class="muted">Manage your storefront and product catalog.</p></div><div class="row"><button id="copyLink" class="btn outline">Copy store link</button><button id="logout" class="btn outline">Sign out</button></div></div><div class="featuregrid" style="margin:22px 0"><div class="feature"><p class="muted">Active products</p><h2>${activeProducts} / ${limit}</h2><p class="muted small">${products.length-activeProducts} unavailable · retained in your catalog</p></div><div class="feature"><p class="muted">Store</p><h2>${t.is_published?'Published':'Draft'}</h2></div><div class="feature"><p class="muted">Plan</p><h2>Free demo</h2><p class="muted small">No payment processed here.</p></div></div>
<div class="panel"><div class="toolbar"><div><h2 style="margin:0">Store settings</h2><p class="muted small">Public URL: <a href="/${encodeURIComponent(t.slug)}" target="_blank" rel="noopener">/${escapeHtml(t.slug)}</a></p></div><button id="publish" class="btn ${t.is_published?'outline':'primary'}">${t.is_published?'Unpublish':'Publish store'}</button></div><form id="settings" class="productgrid"><div class="field"><label>Business name</label><input id="storeName" maxlength="80" value="${escapeHtml(t.business_name||'')}" required></div><div class="field"><label>WhatsApp number (country code, digits only)</label><input id="phone" value="${escapeHtml(t.whatsapp_number||'')}" placeholder="919876543210"></div><div class="field"><label>Store URL slug</label><input id="slug" value="${escapeHtml(t.slug||'')}" pattern="[a-z0-9]+(-[a-z0-9]+)*" required></div><div><button class="btn primary">Save settings</button></div><div id="settingsNotice" class="notice hidden"></div></form></div>

document.getElementById('logout').onclick=logout;document.getElementById('copyLink').onclick=async()=>{const url=location.origin+'/'+t.slug;try{await navigator.clipboard.writeText(url);document.getElementById('copyLink').textContent='Copied';}catch{prompt('Copy store link',url);}};
document.getElementById('publish').onclick=async()=>{if(!t.is_active){alert('This store is suspended. Contact GenieDevs support.');return;}const {data,error}=await db.from('tenants').update({is_published:!t.is_published,updated_at:new Date().toISOString()}).eq('id',t.id).select('id').maybeSingle();if(error||!data){alert(error?.message||'Could not update publication status.');return;}t.is_published=!t.is_published;await renderDashboard();};
document.getElementById('settings').onsubmit=async e=>{e.preventDefault();const payload={business_name:document.getElementById('storeName').value.trim(),whatsapp_number:document.getElementById('phone').value.replace(/\D/g,''),slug:slugify(document.getElementById('slug').value),updated_at:new Date().toISOString()};const {data,error}=await db.from('tenants').update(payload).eq('id',t.id).select('id').maybeSingle();if(error||!data)return notify('settingsNotice',error?.message||'No changes saved.','err');Object.assign(t,payload);notify('settingsNotice','Settings saved.','ok');};
document.getElementById('productForm').onsubmit=async e=>{e.preventDefault();if(products.filter(p=>p.is_available).length>=limit)return notify('productNotice','Your package allows up to '+limit+' active products. Mark an existing product unavailable or upgrade your package.','err');const payload={tenant_id:t.id,name:document.getElementById('pName').value.trim(),price:Math.round(Number(document.getElementById('pPrice').value)),description:document.getElementById('pDesc').value.trim(),image_url:document.getElementById('pImage').value.trim()||null,is_available:true};const {error}=await db.from('products').insert(payload);if(error)return notify('productNotice',error.message,'err');await renderDashboard();};
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this product?'))return;const {error}=await db.from('products').delete().eq('id',b.dataset.delete).eq('tenant_id',t.id);if(error)alert(error.message);else await renderDashboard();});
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.edit);const name=prompt('Product name',p.name);if(name===null)return;const price=prompt('Price in rupees',p.price);if(price===null)return;const description=prompt('Description',p.description||'');if(description===null)return;const image=prompt('Public image URL (optional)',p.image_url||'');if(image===null)return;db.from('products').update({name:name.trim(),price:Math.round(Number(price)),description:description.trim(),image_url:image.trim()||null}).eq('id',p.id).eq('tenant_id',t.id).then(({error})=>error?alert(error.message):renderDashboard());});
document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const willActivate=b.dataset.available!=='true';if(willActivate&&products.filter(p=>p.is_available).length>=limit){alert('Your package allows up to '+limit+' active products. Mark another product unavailable or upgrade your package.');return;}const {error}=await db.from('products').update({is_available:willActivate}).eq('id',b.dataset.toggle).eq('tenant_id',t.id);if(error)alert(error.message);else await renderDashboard();});
document.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const {error}=await db.from('orders').update({status:s.value}).eq('id',s.dataset.status).eq('tenant_id',t.id);if(error)alert('Could not update order status: '+error.message);});
}

function renderStore(){view.innerHTML=`<div class="demo-content"><h3>Store settings</h3><p class="muted">Edit this sample shop profile and preview the result. No real store settings are changed.</p><form id="demoStoreForm"><div class="demo-setting"><label for="demoStoreName">Business name</label><input id="demoStoreName" maxlength="80" value="${escapeHtml(storeSettings.name)}" required></div><div class="demo-setting"><label for="demoTagline">Store tagline</label><input id="demoTagline" maxlength="100" value="${escapeHtml(storeSettings.tagline||'Fresh finds, local love.')}" placeholder="A short line about your shop"></div><div class="demo-setting"><label for="demoStoreWhatsApp">Business WhatsApp (with country code)</label><input id="demoStoreWhatsApp" value="${escapeHtml(storeSettings.whatsapp)}" maxlength="18" required></div><div class="demo-setting"><label for="demoCity">City / service area</label><input id="demoCity" value="${escapeHtml(storeSettings.city)}" maxlength="80" required></div><div class="demo-setting"><label for="demoDelivery">Delivery policy shown to customers</label><select id="demoDelivery">${['Local delivery · Hyderabad','Selected PIN codes only','Across India','Pickup only'].map(x=>`<option ${x===storeSettings.delivery?'selected':''}>${x}</option>`).join('')}</select></div><button class="btn primary" type="submit">Apply demo settings</button><button class="btn outline" id="demoOpenPreview" type="button">View customer storefront ↗</button><span id="demoSettingsNote" class="muted" style="margin-left:10px"></span></form><div class="demo-row"><span>Store URL preview</span><b id="demoSlugPreview">/little-local-market</b></div><p class="muted small">Preview only; actual store URL is assigned during setup.</p></div><div class="demo-content"><h3>Customer-facing shop profile</h3><p class="muted">This is how the configured details could appear on the storefront.</p><h2 id="demoPreviewName">${escapeHtml(storeSettings.name)}</h2><p id="demoPreviewInfo" class="muted">${escapeHtml(storeSettings.city)} · ${escapeHtml(storeSettings.delivery)}</p><span class="demo-chip">WhatsApp-first ordering</span></div>`;document.getElementById('demoStoreForm').onsubmit=e=>{e.preventDefault();storeSettings={name:document.getElementById('demoStoreName').value.trim(),tagline:document.getElementById('demoTagline').value.trim(),whatsapp:document.getElementById('demoStoreWhatsApp').value.trim(),city:document.getElementById('demoCity').value.trim(),delivery:document.getElementById('demoDelivery').value};document.getElementById('demoPreviewName').textContent=storeSettings.name;document.getElementById('demoPreviewInfo').textContent=storeSettings.city+' · '+storeSettings.delivery;const slugEl=document.getElementById('demoSlugPreview');if(slugEl)slugEl.textContent='/'+demoSlug(storeSettings.name);const side=document.getElementById('demoSidebarStoreName');if(side)side.textContent=storeSettings.name;document.getElementById('demoSettingsNote').textContent='Sample settings updated in this session.';document.getElementById('demoQuickAdd').textContent='＋ Add sample item';};document.getElementById('demoOpenPreview').onclick=()=>{document.getElementById('demoStoreForm').requestSubmit();activeTab='preview';render();};const nameInput=document.getElementById('demoStoreName');nameInput.oninput=()=>{const el=document.getElementById('demoSlugPreview');if(el)el.textContent='/'+demoSlug(nameInput.value);};}

function demoSlug(name){return String(name||'my-store').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,50)||'my-store';}
function renderPreview(){const slug=demoSlug(storeSettings.name);view.innerHTML=`<div class="demo-content"><div class="demo-topline"><div><span class="demo-chip">CUSTOMER VIEW · PREVIEW</span><h2 style="margin:10px 0 5px">${escapeHtml(storeSettings.name)}</h2><p class="muted">${escapeHtml(storeSettings.tagline||'Fresh finds, local love.')}</p></div><span class="demo-chip">WhatsApp-first shop</span></div><div class="demo-row"><span>Store URL preview</span><b>/${escapeHtml(slug)}</b></div><p class="muted small">This URL is a preview only. It is not published or reserved until a real store is set up.</p><div class="demo-store-hero"><span class="eyebrow">WELCOME TO OUR STORE</span><h2>${escapeHtml(storeSettings.name)}</h2><p>${escapeHtml(storeSettings.tagline||'Thoughtfully selected products, just for you.')}</p><div class="row"><span class="demo-chip">${escapeHtml(storeSettings.city)}</span><span class="demo-chip">${escapeHtml(storeSettings.delivery)}</span></div></div><div class="demo-topline"><div><h3 style="margin:0">Shop the collection</h3><small class="muted">${samples.length} sample products · fictional demo catalog</small></div><button class="btn outline" data-goto="store">Customize store</button></div><div class="demo-products">${samples.map(productCard).join('')}</div><div class="demo-content" style="margin-top:18px"><h3>Order from ${escapeHtml(storeSettings.name)}</h3><div class="demo-row"><span>Business WhatsApp</span><b>${escapeHtml(storeSettings.whatsapp||'Not configured')}</b></div><div class="demo-row"><span>Service area</span><b>${escapeHtml(storeSettings.city)} · ${escapeHtml(storeSettings.delivery)}</b></div><button class="btn primary" data-goto="checkout">View cart (${cart.reduce((s,x)=>s+x.qty,0)}) · ${money(total())}</button></div></div>`;view.querySelectorAll('[data-goto]').forEach(btn=>btn.onclick=()=>{activeTab=btn.dataset.goto;render();});}
function renderCheckout(){view.innerHTML=`<div class="demo-checkout-grid"><div class="demo-content"><h3>Shopping cart</h3><p class="muted">Add sample products from the catalog to test quantity controls and totals.</p><div id="demoCartLines">${cart.length?cart.map(cartLine).join(''):'<div class="empty">Your demo cart is empty.</div>'}</div><div class="demo-row"><b>Subtotal</b><b>${money(total())}</b></div><div class="demo-row"><span class="muted">Delivery</span><span>Calculated by shop (preview)</span></div><h2 style="text-align:right">${money(total())}</h2><button class="btn outline" id="demoClearCart">Clear cart</button></div><div class="demo-content"><h3>Checkout preview</h3><p class="muted">Enter example details to preview a customer order. This form does not send WhatsApp messages or create a real order.</p><form id="demoCheckoutForm"><div class="demo-setting"><label for="demoCustomer">Customer name</label><input id="demoCustomer" placeholder="e.g. Priya Sharma" required></div><div class="demo-setting"><label for="demoPhone">Phone number</label><input id="demoPhone" type="tel" placeholder="e.g. 98765 43210" required></div><div class="demo-setting"><label for="demoAddress">Delivery address / notes</label><textarea id="demoAddress" rows="3" placeholder="Enter sample delivery details" required></textarea></div><button class="btn primary" type="submit">Preview WhatsApp order</button></form><div id="demoCheckoutNotice" class="notice" role="status">Demo only — nothing is submitted, sent or saved.</div></div></div>`;view.querySelectorAll('[data-qty]').forEach(b=>b.onclick=()=>{const x=cart.find(x=>x.id===b.dataset.qty);if(!x)return;x.qty+=b.dataset.delta==='up'?1:-1;if(x.qty<1)cart=cart.filter(z=>z.id!==x.id);renderCheckout();});document.getElementById('demoClearCart').onclick=()=>{cart=[];renderCheckout();};document.getElementById('demoCheckoutForm').onsubmit=e=>{e.preventDefault();if(!cart.length){notify('demoCheckoutNotice','Add at least one product before previewing checkout.','err');return;}const msg='DEMO ORDER PREVIEW — '+storeSettings.name+'\nCustomer: '+document.getElementById('demoCustomer').value+'\nPhone: '+document.getElementById('demoPhone').value+'\nAddress: '+document.getElementById('demoAddress').value+'\n\n'+cart.map(x=>x.name+' × '+x.qty+' = '+money(x.price*x.qty)).join('\n')+'\n\nTotal: '+money(total());document.getElementById('demoCheckoutNotice').textContent=msg+'\n\nNo message was sent and no order was saved.';document.getElementById('demoCheckoutNotice').className='notice ok';};}
function cartLine(x){return `<div class="demo-row"><div><b>${escapeHtml(x.name)}</b><br><small>${money(x.price)} each</small></div><div style="text-align:right"><div class="demo-qty"><button data-qty="${x.id}" data-delta="down" aria-label="Decrease quantity">−</button><b>${x.qty}</b><button data-qty="${x.id}" data-delta="up" aria-label="Increase quantity">+</button></div><b>${money(x.price*x.qty)}</b></div></div>`;}
function render(){document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===activeTab));document.getElementById('demoBreadcrumb').textContent=activeTab.toUpperCase();const titles={overview:'Good morning 👋',products:'Manage your catalog',orders:'Order management',store:'Store profile & delivery',preview:'Your customer storefront',checkout:'Cart & checkout preview'};document.getElementById('demoTitle').textContent=titles[activeTab];document.getElementById('demoQuickAdd').style.display=activeTab==='products'?'inline-flex':'none';if(activeTab==='overview')renderOverview();else if(activeTab==='products')renderProducts();else if(activeTab==='orders')renderOrders();else if(activeTab==='store')renderStore();else if(activeTab==='preview')renderPreview();else renderCheckout();view.querySelectorAll('[data-add]').forEach(b=>b.onclick=()=>{const p=samples.find(x=>x.id===b.dataset.add);const old=cart.find(x=>x.id===p.id);if(old)old.qty++;else cart.push({...p,qty:1});activeTab='checkout';render();});view.querySelectorAll('[data-goto]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.goto;render();});}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;render();});
document.getElementById('demoQuickAdd').onclick=()=>{activeTab='products';render();const el=document.getElementById('newProductName');if(el){el.focus();el.scrollIntoView({behavior:'smooth',block:'center'});}};
render();
}
async function publicStore(slug){const {data:t,error}=await db.from('tenants').select('id,business_name,slug,whatsapp_number,is_published,is_active').eq('slug',slug).eq('is_published',true).eq('is_active',true).maybeSingle();if(error||!t){app.innerHTML='<div class="panel center"><h1>Store not found</h1><p class="muted">This store may be unpublished or the URL is incorrect.</p><a class="btn primary" href="/">Visit GenieDevs</a></div>';return;}const {data:products}=await db.from('products').select('id,name,price,image_url,description,is_available').eq('tenant_id',t.id).eq('is_available',true).order('created_at',{ascending:false});let cart=[];app.innerHTML='<section class="storehead"><span class="eyebrow">GenieDevs storefront</span><h1>'+escapeHtml(t.business_name)+'</h1><p class="muted">Choose products and send your order request through WhatsApp.</p></section><section class="sections"><div class="productgrid">'+((products||[]).length?products.map(p=>'<article class="product">'+(p.image_url?'<img src="'+escapeHtml(p.image_url)+'" alt="'+escapeHtml(p.name)+'">':'<div class="empty">Product</div>')+'<h3>'+escapeHtml(p.name)+'</h3><p class="muted small">'+escapeHtml(p.description||'')+'</p><div class="price">₹'+Number(p.price).toLocaleString('en-IN')+'</div><button class="btn primary" data-cart="'+escapeHtml(p.id)+'">Add to cart</button></article>').join(''):'<div class="empty">No available products yet.</div>')+'</div><div class="panel" style="margin-top:22px"><h2>Your cart</h2><div id="cartItems" class="stack">Cart is empty.</div><div class="field"><label>Your name</label><input id="customerName" maxlength="100" required></div><div class="field"><label>Phone number</label><input id="customerPhone" type="tel" maxlength="30" required></div><div class="field"><label>Delivery address / notes</label><textarea id="customerAddress" maxlength="500" rows="3" required></textarea></div><button class="btn primary" id="whatsAppOrder">Send order request on WhatsApp</button><div class="notice" id="checkoutNotice">Your order will be saved securely before WhatsApp opens. Keep the order reference for tracking.</div></div></section>';
const renderCart=()=>{const box=document.getElementById('cartItems');if(!cart.length){box.textContent='Cart is empty.';return;}box.innerHTML=cart.map(x=>'<div class="toolbar"><span>'+escapeHtml(x.name)+' × '+x.qty+'</span><b>₹'+(x.price*x.qty).toLocaleString('en-IN')+'</b><button class="btn outline" data-remove="'+escapeHtml(x.id)+'">Remove</button></div>').join('')+'<h3>Total: ₹'+cart.reduce((a,x)=>a+x.price*x.qty,0).toLocaleString('en-IN')+'</h3>';box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.id!==b.dataset.remove);renderCart();});};
app.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{const p=(products||[]).find(x=>x.id===b.dataset.cart);const old=cart.find(x=>x.id===p.id);if(old)old.qty++;else cart.push({id:p.id,name:p.name,price:Number(p.price),qty:1});renderCart();});
document.getElementById('whatsAppOrder').onclick=async()=>{const button=document.getElementById('whatsAppOrder');const name=document.getElementById('customerName').value.trim(),phone=document.getElementById('customerPhone').value.trim(),address=document.getElementById('customerAddress').value.trim();if(!cart.length)return notify('checkoutNotice','Add at least one product first.','err');if(name.length<2||!phone||address.length<5)return notify('checkoutNotice','Please enter a valid name, phone and delivery address.','err');if(button.disabled)return;const waWindow=window.open('about:blank','_blank');button.disabled=true;button.textContent='Saving order…';try{const {data,error}=await db.rpc('create_store_order',{p_slug:slug,p_customer_name:name,p_customer_phone:phone,p_customer_address:address,p_items:cart.map(x=>({product_id:x.id,quantity:x.qty}))});if(error)throw error;const order=Array.isArray(data)?data[0]:data;if(!order||!order.reference_code)throw new Error('Order response was incomplete. Please check your order status before retrying.');const ownerPhone=String(order.store_whatsapp||t.whatsapp_number||'').replace(/\D/g,'');const total=Number(order.total_amount||0);const message='New order for '+(order.store_name||t.business_name)+'\nOrder reference: '+order.reference_code+'\n\nCustomer: '+name+'\nPhone: '+phone+'\nAddress: '+address+'\n\nItems:\n'+cart.map(x=>x.name+' x '+x.qty+' = ₹'+(x.price*x.qty)).join('\n')+'\n\nTotal: ₹'+total;if(ownerPhone){if(waWindow)waWindow.location.href='https://wa.me/'+ownerPhone+'?text='+encodeURIComponent(message);else window.location.href='https://wa.me/'+ownerPhone+'?text='+encodeURIComponent(message);notify('checkoutNotice','Order saved successfully. Reference: '+order.reference_code+'. WhatsApp chat is opening.','ok');}else{if(waWindow)waWindow.close();notify('checkoutNotice','Order saved successfully. Reference: '+order.reference_code+'. The store owner has not configured WhatsApp yet.','ok');}cart=[];renderCart();}catch(err){if(waWindow)waWindow.close();notify('checkoutNotice',err.message||'Could not save the order. Please try again.','err');}finally{button.disabled=false;button.textContent='Send order request on WhatsApp';}};
}
async function logout(){if(db)await db.auth.signOut();user=null;tenant=null;landing();window.scrollTo(0,0);document.getElementById('navAuth').textContent='Sign in';document.getElementById('navAuth').onclick=()=>showAuth('signin');}
async function init(){const path=decodeURIComponent(location.pathname).replace(/\/+$/,'')||'/';if(path==='/demo'){demo();return;}if(path.startsWith('/store/')){if(!db){app.innerHTML='<div class="panel center"><h1>Could not connect</h1><p>Please refresh and try again.</p></div>';return;}await publicStore(path.split('/')[2]||'');return;}if(path!=='/'&&path!=='/index.html'){if(!db){app.innerHTML='<div class="panel center"><h1>Could not connect</h1><p>Please refresh and try again.</p></div>';return;}await publicStore(path.slice(1));return;}if(!db){landing();return;}const {data:{user:currentUser}}=await db.auth.getUser();if(currentUser){await dashboard();return;}landing();document.getElementById('navAuth').textContent='Sign in';document.getElementById('navAuth').onclick=()=>showAuth('signin');const cta=document.getElementById('accountSubmit');if(cta)cta.onclick=()=>showAuth('signup');const sw=document.getElementById('accountSwitch');if(sw)sw.onclick=()=>showAuth('signin');}

function setupTheme(){
const saved=(()=>{try{return localStorage.getItem('geniedevs-theme')}catch{return null}})();
const initial=saved==='light'?'light':'dark';
document.body.dataset.theme=initial;
const toggle=document.getElementById('themeToggle');
if(!toggle)return;
const paint=()=>{const light=document.body.dataset.theme==='light';toggle.textContent=light?'🌙 Dark':'☀️ Light';toggle.setAttribute('aria-label',light?'Switch to dark theme':'Switch to light theme');toggle.title=light?'Switch to dark theme':'Switch to light theme';};
paint();
toggle.onclick=()=>{const next=document.body.dataset.theme==='light'?'dark':'light';document.body.dataset.theme=next;try{localStorage.setItem('geniedevs-theme',next)}catch{}paint();};
}
setupTheme();
init();
})();
</script>
