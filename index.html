<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#101827">
<title>GenieDevs — Your online store, made simple</title><meta name="description" content="Create a shareable storefront for your small business with GenieDevs.">
<style>
:root{--bg:#f7f8fc;--ink:#101827;--muted:#657087;--card:#fff;--line:#e5e9f2;--brand:#635bff;--good:#087f5b;--bad:#b42318;--shadow:0 18px 55px #141e3c12}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;font:16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:var(--bg);color:var(--ink)}a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit}button{cursor:pointer}.wrap{width:min(1120px,calc(100% - 32px));margin:auto}.nav{display:flex;align-items:center;justify-content:space-between;padding:18px 0}.logo{font-weight:850;font-size:1.3rem;letter-spacing:-.7px}.logo span{color:var(--brand)}.navlinks,.actions,.toolbar,.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.navlinks{gap:18px;color:#465066;font-size:.93rem}.btn{display:inline-flex;align-items:center;justify-content:center;border:0;border-radius:11px;padding:11px 16px;font-weight:750}.primary{background:var(--brand);color:white}.outline{background:white;border:1px solid var(--line);color:var(--ink)}.danger{background:#fff0ee;color:var(--bad)}.hero{display:grid;grid-template-columns:1.05fr .95fr;gap:42px;align-items:center;padding:65px 0 78px}.eyebrow{display:inline-flex;border:1px solid #dcd9ff;background:#f0efff;color:#4940bf;padding:7px 11px;border-radius:999px;font-size:.82rem;font-weight:750}.hero h1{font-size:clamp(2.6rem,5vw,4.4rem);line-height:1.04;letter-spacing:-2.5px;margin:22px 0}.gradient{background:linear-gradient(100deg,#635bff,#a855f7);-webkit-background-clip:text;background-clip:text;color:transparent}.hero p,.muted{color:var(--muted)}.hero p{font-size:1.1rem}.mock,.panel,.feature,.pricecard,.product{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:var(--shadow)}.mock{background:#121b2d;color:white}.mockinner{background:white;color:var(--ink);border-radius:13px;padding:18px}.sections{padding:55px 0}.sectionhead{text-align:center;max-width:680px;margin:0 auto 28px}.sectionhead h2{font-size:clamp(1.8rem,3vw,2.5rem);margin:0 0 8px;letter-spacing:-1px}.sectionhead p{color:var(--muted);margin:0}.featuregrid,.pricegrid,.productgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.feature h3{margin:8px 0}.feature p{color:var(--muted);margin:0}.pricing{background:#f0f1fb}.price{font-size:2rem;font-weight:850;margin:8px 0}.pricecard ul{padding-left:18px;color:var(--muted)}.pricecard .btn{width:100%}.center{max-width:650px;margin:28px auto}.tabs{display:flex;gap:8px;margin-bottom:16px}.tabs .active{background:#eeedff;color:#4438ca;border-color:#c9c5ff}.field{display:grid;gap:6px;margin:12px 0}.field label{font-weight:700;font-size:.92rem}.field input,.field select,.field textarea{width:100%;padding:11px 12px;border:1px solid #d9deea;border-radius:10px;background:white;color:var(--ink)}.notice{padding:12px 14px;border-radius:10px;background:#fff4db;color:#7a4d00;margin:14px 0}.notice.ok{background:#e9fff5;color:var(--good)}.notice.err{background:#fff0ee;color:var(--bad)}.hidden{display:none!important}.toolbar{justify-content:space-between}.product{box-shadow:none;padding:15px}.product img{width:100%;height:155px;object-fit:cover;border-radius:10px;background:#f0f1f7}.product h3{margin:10px 0 2px}.product .price{font-size:1.2rem}.empty{text-align:center;padding:26px;color:var(--muted);border:1px dashed #ccd2df;border-radius:14px}.storehead{padding:32px 0 18px}.storehead h1{margin:10px 0;font-size:clamp(2rem,5vw,3rem)}.pill{display:inline-block;padding:4px 8px;border-radius:7px;background:#e9fff5;color:var(--good);font-size:.8rem;font-weight:800}.footer{padding:25px 0 35px;color:#737d91;font-size:.85rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;flex-wrap:wrap;gap:12px}
@media(max-width:800px){.hero{grid-template-columns:1fr;padding:42px 0 55px;gap:24px}.featuregrid,.pricegrid,.productgrid{grid-template-columns:1fr}.navlinks{gap:9px}.navlinks .hide-sm{display:none}.hero h1{letter-spacing:-1.5px}}
</style>
</head>
<body>
<header class="wrap"><nav class="nav"><a class="logo" href="/">Genie<span>Devs</span></a><div class="navlinks"><a class="hide-sm" href="/#features">Features</a><a class="hide-sm" href="/#pricing">Pricing</a><a href="/#start">Get started</a><button id="navAuth" class="btn primary" type="button">Sign in</button></div></nav></header>
<main id="app" class="wrap"><div class="panel center">Loading GenieDevs…</div></main>
<footer class="wrap footer"><span>© <span id="year"></span> GenieDevs</span><span>Built for small businesses.</span></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(()=>{'use strict';
const URL='https://brjhfhehnlqkzrbkywra.supabase.co';
const KEY='sb_publishable_0xA3CBSdLRlhO7Vh0F0d0g_JaoScMry';
const app=document.getElementById('app');document.getElementById('year').textContent=new Date().getFullYear();
const db=window.supabase?.createClient?window.supabase.createClient(URL,KEY):null;
let user=null,tenant=null,mode='signup';
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const slugify=s=>String(s||'store').toLowerCase().trim().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'').slice(0,48)||'store';
const notify=(id,text,type='')=>{const e=document.getElementById(id);if(e){e.textContent=text;e.className='notice '+type;}};
function landing(){app.innerHTML=`
<section class="hero"><div><span class="eyebrow">For small businesses</span><h1>Your business deserves an <span class="gradient">online store.</span></h1><p>Create a shareable storefront for your products. Let customers browse your catalog and order through WhatsApp — no complicated setup.</p><div class="actions"><a class="btn primary" href="#start">Create your store →</a><a class="btn outline" href="#features">Explore features</a></div><p class="muted">Mobile-friendly · Shareable store link · WhatsApp-first ordering</p></div><div class="mock"><b>YOUR STORE PREVIEW</b><div class="mockinner" style="margin-top:14px"><b>Little Local Market</b><div class="productgrid" style="grid-template-columns:repeat(2,minmax(0,1fr));margin-top:14px"><div class="product">🫙<h3>Homemade Pickle</h3><b>₹180</b></div><div class="product">🍯<h3>Natural Honey</h3><b>₹250</b></div><div class="product">🌶️<h3>Spice Mix</h3><b>₹120</b></div><div class="product">🍪<h3>Fresh Cookies</h3><b>₹160</b></div></div></div></div></section>
<section class="sections" id="features"><div class="sectionhead"><h2>Everything to get started</h2><p>A simple storefront for local sellers, boutiques, homemade food businesses and independent retailers.</p></div><div class="featuregrid"><article class="feature"><h3>Your own store link</h3><p>Share one easy link with customers.</p></article><article class="feature"><h3>Product catalog</h3><p>Add product photos, descriptions, prices and availability.</p></article><article class="feature"><h3>WhatsApp-first orders</h3><p>Customers can send their cart and delivery details to your business.</p></article></div></section>
<section class="sections pricing" id="pricing"><div class="sectionhead"><h2>Start with a free demo</h2><p>Our main done-for-you store setup offer is ₹999 one-time. No payment is collected on this website yet.</p></div><div class="pricegrid"><article class="pricecard"><h3>Free demo</h3><div class="price">₹0</div><p class="muted">Explore your store setup</p><ul><li>Create a merchant account</li><li>Build a draft storefront</li><li>Test product setup</li></ul><a class="btn outline" href="#start">Start free demo</a></article><article class="pricecard" style="border:2px solid var(--brand)"><span class="pill">Main offer</span><h3 style="margin-top:12px">Done-for-you setup</h3><div class="price">₹999 <span class="muted" style="font-size:.9rem;font-weight:500">one-time</span></div><p class="muted">For small businesses that want help launching</p><ul><li>Store setup assistance</li><li>Initial product catalog setup</li><li>WhatsApp ordering setup</li></ul><a class="btn primary" href="#start">Get started</a></article><article class="pricecard"><h3>Custom needs</h3><div class="price">Let's talk</div><p class="muted">For larger catalogs or special requirements</p><ul><li>Discuss your catalog</li><li>Plan the setup</li><li>Agree scope before payment</li></ul><a class="btn outline" href="#start">Create a demo</a></article></div></section>
<section class="sections" id="start"><div class="sectionhead"><h2>Start your store</h2><p>Create an account or sign in to manage your storefront.</p></div><div class="panel center"><div class="tabs"><button class="btn outline active" id="signupTab" type="button">Create account</button><button class="btn outline" id="loginTab" type="button">Sign in</button></div><form id="authForm"><div class="field" id="businessField"><label for="business">Business / store name</label><input id="business" maxlength="80" placeholder="e.g. Little Local Market" required></div><div class="field"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required></div><div class="field"><label for="password">Password (at least 8 characters)</label><input id="password" type="password" minlength="8" autocomplete="new-password" required></div><button class="btn primary" id="authSubmit" type="submit">Create account</button><div id="authNotice" class="notice hidden" role="status"></div></form><p class="muted small">No payment is collected here. Store publication does not mean paid-plan activation.</p></div></section>`;
const setMode=m=>{mode=m;document.getElementById('signupTab').classList.toggle('active',m==='signup');document.getElementById('loginTab').classList.toggle('active',m==='login');document.getElementById('businessField').classList.toggle('hidden',m==='login');document.getElementById('business').required=m==='signup';document.getElementById('password').autocomplete=m==='login'?'current-password':'new-password';document.getElementById('authSubmit').textContent=m==='login'?'Sign in':'Create account';document.getElementById('authNotice').classList.add('hidden');};
document.getElementById('signupTab').onclick=()=>setMode('signup');document.getElementById('loginTab').onclick=()=>setMode('login');
document.getElementById('authForm').onsubmit=async e=>{e.preventDefault();if(!db)return notify('authNotice','Supabase client did not load. Refresh and try again.','err');const b=document.getElementById('authSubmit');b.disabled=true;try{const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;let res;if(mode==='login'){res=await db.auth.signInWithPassword({email,password});if(res.error)throw res.error;user=res.data.user;await dashboard();return;}const business=document.getElementById('business').value.trim();res=await db.auth.signUp({email,password,options:{data:{business_name:business}}});if(res.error)throw res.error;if(!res.data.session){notify('authNotice','Account created. Check your email to confirm it, then sign in. Your store will be created after confirmation.','ok');return;}user=res.data.user;const t=await createTenant(business);if(t){tenant=t;await dashboard();}}catch(err){notify('authNotice',err.message||'Authentication failed.','err');}finally{b.disabled=false;b.textContent=mode==='login'?'Sign in':'Create account';}};
}
async function createTenant(name){const slug=slugify(name)+'-'+Math.random().toString(36).slice(2,6);const {data,error}=await db.from('tenants').insert({user_id:user.id,tenant_code:'GD-'+crypto.randomUUID().replace(/-/g,'').slice(0,12).toUpperCase(),package_type:'Demo',product_limit:50,business_name:name,slug,is_published:false,whatsapp_number:null}).select('id,user_id,tenant_code,package_type,product_limit,whatsapp_number,business_name,slug,is_published').single();if(error){alert('Account created, but store setup needs attention: '+error.message);return null;}return data;}
async function dashboard(){const {data:auth}=await db.auth.getUser();user=auth.user;if(!user){landing();return;}document.getElementById('navAuth').textContent='Dashboard';const {data:ts,error}=await db.from('tenants').select('id,user_id,tenant_code,package_type,product_limit,whatsapp_number,business_name,slug,is_published').eq('user_id',user.id).limit(1);if(error){app.innerHTML='<div class="panel center"><h2>Could not load your store</h2><p>'+escapeHtml(error.message)+'</p><button id="logout" class="btn outline">Sign out</button></div>';document.getElementById('logout').onclick=logout;return;}if(!ts?.length){app.innerHTML='<div class="panel center"><h1>Finish store setup</h1><div class="field"><label>Business name</label><input id="retryName" maxlength="80"></div><button class="btn primary" id="retry">Create store</button><div id="retryNotice" class="notice hidden"></div><button class="btn outline" id="logout">Sign out</button></div>';document.getElementById('retry').onclick=async()=>{const n=document.getElementById('retryName').value.trim();if(!n)return notify('retryNotice','Enter your business name.','err');const t=await createTenant(n);if(t){tenant=t;await dashboard();}};document.getElementById('logout').onclick=logout;return;}tenant=ts[0];await renderDashboard();}
async function renderDashboard(){const t=tenant;const {data:products,error}=await db.from('products').select('id,tenant_id,name,price,image_url,description,is_available,created_at').eq('tenant_id',t.id).order('created_at',{ascending:false});if(error){app.innerHTML='<div class="panel center"><h2>Product list could not load</h2><p>'+escapeHtml(error.message)+'</p></div>';return;}const limit=t.product_limit||50;const {data:orders}=await db.from('orders').select('id,reference_code,customer_name,customer_phone,customer_address,items,total_amount,status,created_at').eq('tenant_id',t.id).order('created_at',{ascending:false}).limit(50);
app.innerHTML=`<section class="sections"><div class="toolbar"><div><span class="eyebrow">Merchant dashboard</span><h1 style="margin:8px 0">${escapeHtml(t.business_name)}</h1><p class="muted">Manage your storefront and product catalog.</p></div><div class="row"><button id="copyLink" class="btn outline">Copy store link</button><button id="logout" class="btn outline">Sign out</button></div></div><div class="featuregrid" style="margin:22px 0"><div class="feature"><p class="muted">Products</p><h2>${products.length} / ${limit}</h2></div><div class="feature"><p class="muted">Store</p><h2>${t.is_published?'Published':'Draft'}</h2></div><div class="feature"><p class="muted">Plan</p><h2>Free demo</h2><p class="muted small">No payment processed here.</p></div></div>
<div class="panel"><div class="toolbar"><div><h2 style="margin:0">Store settings</h2><p class="muted small">Public URL: <a href="/store/${encodeURIComponent(t.slug)}" target="_blank" rel="noopener">/store/${escapeHtml(t.slug)}</a></p></div><button id="publish" class="btn ${t.is_published?'outline':'primary'}">${t.is_published?'Unpublish':'Publish store'}</button></div><form id="settings" class="productgrid"><div class="field"><label>Business name</label><input id="storeName" maxlength="80" value="${escapeHtml(t.business_name||'')}" required></div><div class="field"><label>WhatsApp number (country code, digits only)</label><input id="phone" value="${escapeHtml(t.whatsapp_number||'')}" placeholder="919876543210"></div><div class="field"><label>Store URL slug</label><input id="slug" value="${escapeHtml(t.slug||'')}" pattern="[a-z0-9]+(-[a-z0-9]+)*" required></div><div><button class="btn primary">Save settings</button></div><div id="settingsNotice" class="notice hidden"></div></form></div>
<div class="panel" style="margin-top:18px"><h2>Add a product</h2><p class="muted small">Up to ${limit} products. Use a publicly accessible image URL for now.</p><form id="productForm" class="productgrid"><div class="field"><label>Product name</label><input id="pName" maxlength="120" required></div><div class="field"><label>Price (₹)</label><input id="pPrice" type="number" min="0" step="1" required></div><div class="field"><label>Description</label><input id="pDesc" maxlength="500" placeholder="Short product details"></div><div class="field"><label>Image URL (optional)</label><input id="pImage" type="url" placeholder="https://…"></div><div><button class="btn primary" ${products.length>=limit?'disabled':''}>Add product</button></div><div id="productNotice" class="notice hidden"></div></form></div>
<h2 style="margin-top:26px">Your products</h2><div class="productgrid">${products.length?products.map(p=>'<article class="product">'+(p.image_url?'<img src="'+escapeHtml(p.image_url)+'" alt="'+escapeHtml(p.name)+'">':'<div class="empty">No image</div>')+'<h3>'+escapeHtml(p.name)+'</h3><p class="muted small">'+escapeHtml(p.description||'')+'</p><div class="price">₹'+Number(p.price).toLocaleString('en-IN')+'</div><p>'+ (p.is_available?'<span class="pill">Available</span>':'<span class="pill" style="background:#fff4db;color:#7a4d00">Unavailable</span>')+'</p><div class="row"><button class="btn outline" data-edit="'+escapeHtml(p.id)+'">Edit</button><button class="btn outline" data-toggle="'+escapeHtml(p.id)+'" data-available="'+String(p.is_available)+'">'+(p.is_available?'Mark unavailable':'Mark available')+'</button><button class="btn danger" data-delete="'+escapeHtml(p.id)+'">Delete</button></div></article>').join(''):'<div class="empty">No products yet. Add your first product above.</div>'}</div>
<h2 style="margin-top:28px">Orders</h2><p class="muted small">Order creation is not enabled until the secure checkout endpoint is installed. Existing orders are shown below.</p><div class="stack">${orders?.length?orders.map(o=>'<article class="product"><div class="toolbar"><div><b>'+escapeHtml(o.reference_code||'Order')+'</b><p class="muted small">'+escapeHtml(o.customer_name)+' · '+escapeHtml(o.customer_phone)+' · '+new Date(o.created_at).toLocaleString()+'</p></div><b>₹'+Number(o.total_amount||0).toLocaleString('en-IN')+'</b></div><p class="small">'+escapeHtml(o.customer_address||'')+'</p><label class="small">Status <select data-status="'+escapeHtml(o.id)+'">'+['pending','confirmed','preparing','completed','cancelled'].map(s=>'<option '+(o.status===s?'selected':'')+'>'+s+'</option>').join('')+'</select></label></article>').join(''):'<div class="empty">No saved orders yet.</div>'}</div><p class="muted small" style="margin-top:24px">Payments are not enabled. WhatsApp checkout does not save an order to the database until the secure checkout endpoint is connected.</p></section>`;
document.getElementById('logout').onclick=logout;document.getElementById('copyLink').onclick=async()=>{const url=location.origin+'/store/'+t.slug;try{await navigator.clipboard.writeText(url);document.getElementById('copyLink').textContent='Copied';}catch{prompt('Copy store link',url);}};
document.getElementById('publish').onclick=async()=>{const {data,error}=await db.from('tenants').update({is_published:!t.is_published,updated_at:new Date().toISOString()}).eq('id',t.id).select('id').maybeSingle();if(error||!data){alert(error?.message||'Could not update publication status.');return;}t.is_published=!t.is_published;await renderDashboard();};
document.getElementById('settings').onsubmit=async e=>{e.preventDefault();const payload={business_name:document.getElementById('storeName').value.trim(),whatsapp_number:document.getElementById('phone').value.replace(/\D/g,''),slug:slugify(document.getElementById('slug').value),updated_at:new Date().toISOString()};const {data,error}=await db.from('tenants').update(payload).eq('id',t.id).select('id').maybeSingle();if(error||!data)return notify('settingsNotice',error?.message||'No changes saved.','err');Object.assign(t,payload);notify('settingsNotice','Settings saved.','ok');};
document.getElementById('productForm').onsubmit=async e=>{e.preventDefault();if(products.length>=limit)return notify('productNotice','This demo has reached its product limit.','err');const payload={tenant_id:t.id,name:document.getElementById('pName').value.trim(),price:Math.round(Number(document.getElementById('pPrice').value)),description:document.getElementById('pDesc').value.trim(),image_url:document.getElementById('pImage').value.trim()||null,is_available:true};const {error}=await db.from('products').insert(payload);if(error)return notify('productNotice',error.message,'err');await renderDashboard();};
document.querySelectorAll('[data-delete]').forEach(b=>b.onclick=async()=>{if(!confirm('Delete this product?'))return;const {error}=await db.from('products').delete().eq('id',b.dataset.delete).eq('tenant_id',t.id);if(error)alert(error.message);else await renderDashboard();});
document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>{const p=products.find(x=>x.id===b.dataset.edit);const name=prompt('Product name',p.name);if(name===null)return;const price=prompt('Price in rupees',p.price);if(price===null)return;const description=prompt('Description',p.description||'');if(description===null)return;const image=prompt('Public image URL (optional)',p.image_url||'');if(image===null)return;db.from('products').update({name:name.trim(),price:Math.round(Number(price)),description:description.trim(),image_url:image.trim()||null}).eq('id',p.id).eq('tenant_id',t.id).then(({error})=>error?alert(error.message):renderDashboard());});
document.querySelectorAll('[data-toggle]').forEach(b=>b.onclick=async()=>{const {error}=await db.from('products').update({is_available:b.dataset.available!=='true'}).eq('id',b.dataset.toggle).eq('tenant_id',t.id);if(error)alert(error.message);else await renderDashboard();});
document.querySelectorAll('[data-status]').forEach(s=>s.onchange=async()=>{const {error}=await db.from('orders').update({status:s.value}).eq('id',s.dataset.status).eq('tenant_id',t.id);if(error)alert('Could not update order status: '+error.message);});
}
async function publicStore(slug){const {data:t,error}=await db.from('tenants').select('id,business_name,slug,whatsapp_number,is_published').eq('slug',slug).eq('is_published',true).maybeSingle();if(error||!t){app.innerHTML='<div class="panel center"><h1>Store not found</h1><p class="muted">This store may be unpublished or the URL is incorrect.</p><a class="btn primary" href="/">Visit GenieDevs</a></div>';return;}const {data:products}=await db.from('products').select('id,name,price,image_url,description,is_available').eq('tenant_id',t.id).eq('is_available',true).order('created_at',{ascending:false});let cart=[];app.innerHTML='<section class="storehead"><span class="eyebrow">GenieDevs storefront</span><h1>'+escapeHtml(t.business_name)+'</h1><p class="muted">Choose products and send your order request through WhatsApp.</p></section><section class="sections"><div class="productgrid">'+((products||[]).length?products.map(p=>'<article class="product">'+(p.image_url?'<img src="'+escapeHtml(p.image_url)+'" alt="'+escapeHtml(p.name)+'">':'<div class="empty">Product</div>')+'<h3>'+escapeHtml(p.name)+'</h3><p class="muted small">'+escapeHtml(p.description||'')+'</p><div class="price">₹'+Number(p.price).toLocaleString('en-IN')+'</div><button class="btn primary" data-cart="'+escapeHtml(p.id)+'">Add to cart</button></article>').join(''):'<div class="empty">No available products yet.</div>')+'</div><div class="panel" style="margin-top:22px"><h2>Your cart</h2><div id="cartItems" class="stack">Cart is empty.</div><div class="field"><label>Your name</label><input id="customerName" maxlength="100" required></div><div class="field"><label>Phone number</label><input id="customerPhone" type="tel" maxlength="30" required></div><div class="field"><label>Delivery address / notes</label><textarea id="customerAddress" maxlength="500" rows="3" required></textarea></div><button class="btn primary" id="whatsAppOrder">Send order request on WhatsApp</button><div class="notice" id="checkoutNotice">Your order will be saved securely before WhatsApp opens. Keep the order reference for tracking.</div></div></section>';
const renderCart=()=>{const box=document.getElementById('cartItems');if(!cart.length){box.textContent='Cart is empty.';return;}box.innerHTML=cart.map(x=>'<div class="toolbar"><span>'+escapeHtml(x.name)+' × '+x.qty+'</span><b>₹'+(x.price*x.qty).toLocaleString('en-IN')+'</b><button class="btn outline" data-remove="'+escapeHtml(x.id)+'">Remove</button></div>').join('')+'<h3>Total: ₹'+cart.reduce((a,x)=>a+x.price*x.qty,0).toLocaleString('en-IN')+'</h3>';box.querySelectorAll('[data-remove]').forEach(b=>b.onclick=()=>{cart=cart.filter(x=>x.id!==b.dataset.remove);renderCart();});};
app.querySelectorAll('[data-cart]').forEach(b=>b.onclick=()=>{const p=(products||[]).find(x=>x.id===b.dataset.cart);const old=cart.find(x=>x.id===p.id);if(old)old.qty++;else cart.push({id:p.id,name:p.name,price:Number(p.price),qty:1});renderCart();});
document.getElementById('whatsAppOrder').onclick=async()=>{const button=document.getElementById('whatsAppOrder');const name=document.getElementById('customerName').value.trim(),phone=document.getElementById('customerPhone').value.trim(),address=document.getElementById('customerAddress').value.trim();if(!cart.length)return notify('checkoutNotice','Add at least one product first.','err');if(name.length<2||!phone||address.length<5)return notify('checkoutNotice','Please enter a valid name, phone and delivery address.','err');if(button.disabled)return;const waWindow=window.open('about:blank','_blank');button.disabled=true;button.textContent='Saving order…';try{const {data,error}=await db.rpc('create_store_order',{p_slug:slug,p_customer_name:name,p_customer_phone:phone,p_customer_address:address,p_items:cart.map(x=>({product_id:x.id,quantity:x.qty}))});if(error)throw error;const order=Array.isArray(data)?data[0]:data;if(!order||!order.reference_code)throw new Error('Order response was incomplete. Please check your order status before retrying.');const ownerPhone=String(order.store_whatsapp||t.whatsapp_number||'').replace(/\D/g,'');const total=Number(order.total_amount||0);const message='New order for '+(order.store_name||t.business_name)+'\nOrder reference: '+order.reference_code+'\n\nCustomer: '+name+'\nPhone: '+phone+'\nAddress: '+address+'\n\nItems:\n'+cart.map(x=>x.name+' x '+x.qty+' = ₹'+(x.price*x.qty)).join('\n')+'\n\nTotal: ₹'+total;if(ownerPhone){if(waWindow)waWindow.location.href='https://wa.me/'+ownerPhone+'?text='+encodeURIComponent(message);else window.location.href='https://wa.me/'+ownerPhone+'?text='+encodeURIComponent(message);notify('checkoutNotice','Order saved successfully. Reference: '+order.reference_code+'. WhatsApp chat is opening.','ok');}else{if(waWindow)waWindow.close();notify('checkoutNotice','Order saved successfully. Reference: '+order.reference_code+'. The store owner has not configured WhatsApp yet.','ok');}cart=[];renderCart();}catch(err){if(waWindow)waWindow.close();notify('checkoutNotice',err.message||'Could not save the order. Please try again.','err');}finally{button.disabled=false;button.textContent='Send order request on WhatsApp';}};
}
async function logout(){await db.auth.signOut();user=null;tenant=null;landing();window.scrollTo(0,0);}
async function init(){if(!db){app.innerHTML='<div class="panel center"><h1>Could not connect</h1><p>Supabase client did not load. Refresh and try again.</p></div>';return;}const path=decodeURIComponent(location.pathname);if(path.startsWith('/store/')){await publicStore(path.split('/')[2]||'');return;}const {data}=await db.auth.getSession();if(data.session){user=data.session.user;await dashboard();}else landing();document.getElementById('navAuth').onclick=()=>{if(user)dashboard();else document.getElementById('start')?.scrollIntoView({behavior:'smooth'});};db.auth.onAuthStateChange((event,session)=>{if(event==='SIGNED_OUT'){user=null;tenant=null;}});}
init();
})();
</script>
